name: DriftMaps Skill Tests

on:
  pull_request:
    paths:
      - "driftmaps/**"
      - "driftmap-presenter/**"
      - ".github/workflows/driftmaps-tests.yml"
  push:
    branches:
      - main
    paths:
      - "driftmaps/**"
      - "driftmap-presenter/**"
      - ".github/workflows/driftmaps-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML support
        run: python -m pip install -r driftmaps/requirements.txt
      - name: Compile tools and tests
        run: python -m compileall -q driftmaps/scripts driftmaps/tests
      - name: Run unit tests
        run: python -m unittest discover -s driftmaps/tests -v
      - name: Validate example Map
        run: python driftmaps/scripts/driftmaps.py validate driftmaps/examples/burrito-cannon/MAP.md
      - name: Inspect example Map
        run: python driftmaps/scripts/driftmaps.py inspect driftmaps/examples/burrito-cannon/MAP.md --json
